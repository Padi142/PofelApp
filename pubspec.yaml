name: pofel_app
description: Pofel app rebuilt for current Flutter with Appwrite.
publish_to: "none"

version: 2.0.4+34

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  appwrite: ^22.0.0
  auto_size_text: ^3.0.0
  bloc: ^8.1.4
  cached_network_image: ^3.4.1
  copy_with_extension: ^5.0.4
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_bloc: ^8.1.6
  flutter_map: ^7.0.2
  flutter_rating_stars: ^1.1.0
  gal: ^2.3.2
  geolocator: ^12.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  maps_launcher: ^3.0.0
  permission_handler: ^11.4.0
  reactive_forms: ^17.0.1
  rflutter_alert: ^2.0.7
  share_plus: ^10.1.4
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2

dev_dependencies:
  build_runner: ^2.4.13
  copy_with_extension_gen: ^5.0.4
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "pofel_logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "pofel_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.33
